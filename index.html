<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Booster Game</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
  <div class="container">
    <h1>🧠 Memory Booster</h1>
    
    <div class="stats glass-panel">
      <p>Score: <span id="score">0</span></p>
      <p>Level: <span id="level">1</span></p>
      <p>Lives: <span id="lives">3</span></p>
      <p>Time: <span id="timer">60</span>s</p>
      <p>Moves: <span id="moves">0</span></p>
      <p>Stars: <span id="stars">⭐⭐⭐</span></p>
    </div>

    <div id="grid" class="grid-4x4"></div>
    
    <div id="startScreen" class="glass-panel overlay">
      <h2>Welcome!</h2>
      <p>Select your deck theme:</p>
      <select id="themeSelect" class="dropdown">
        <option value="tech">💻 Tech</option>
        <option value="animals">🐶 Animals</option>
        <option value="food">🍔 Food</option>
        <option value="spooky">🎃 Spooky</option>
      </select>
      <button onclick="initGame()" class="primary-btn" style="margin-top: 20px;">Start Game</button>
    </div>
    
    <div id="gameOver" class="hidden glass-panel overlay">
      <h2 id="endMessage">Game Over</h2>
      <p>Final Score: <span id="finalScore">0</span></p>
      <p>High Score: <span id="highScore">0</span></p>
      <button class="primary-btn" onclick="initGame()" style="margin-top: 15px;">Play Again</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
